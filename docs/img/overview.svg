<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" role="img" aria-labelledby="t d"><title id="t">Pairpost overview</title><desc id="d">You and your agent talk to a contact and their agent through a blind relay, end to end encrypted, after both of you added each other’s address.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker><marker id="b" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0L0 5L10 10z" fill="#6b7280"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><rect x="250" y="14" width="380" height="46" rx="10" fill="#fff3d6" stroke="#d97706" stroke-width="2"/><text x="440.0" y="41.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#1e1b4b">Both people add each other’s address before anything is read</text><rect x="30" y="100" width="170" height="64" rx="10" fill="#eef0ff" stroke="#6366f1" stroke-width="2"/><text x="115.0" y="127.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#1e1b4b">You</text><text x="115.0" y="145.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#4b5563">holds your key</text><rect x="30" y="214" width="170" height="64" rx="10" fill="#eef0ff" stroke="#6366f1" stroke-width="2"/><text x="115.0" y="241.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#1e1b4b">Your agent</text><text x="115.0" y="259.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#4b5563">Claude Code, Codex, …</text><rect x="680" y="100" width="170" height="64" rx="10" fill="#eef0ff" stroke="#6366f1" stroke-width="2"/><text x="765.0" y="127.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#1e1b4b">Your contact</text><text x="765.0" y="145.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#4b5563">holds their key</text><rect x="680" y="214" width="170" height="64" rx="10" fill="#eef0ff" stroke="#6366f1" stroke-width="2"/><text x="765.0" y="241.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#1e1b4b">Their agent</text><text x="765.0" y="259.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#4b5563">their own agent host</text><rect x="330" y="180" width="220" height="132" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 5"/><text x="440.0" y="223.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#1e1b4b">A relay</text><text x="440.0" y="241.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#4b5563">stores sealed blobs under</text><text x="440.0" y="259.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#4b5563">mailbox names only the</text><text x="440.0" y="277.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#4b5563">two of you can compute</text><line x1="115" y1="164" x2="115" y2="214" stroke="#6b7280" stroke-width="2.2" marker-end="url(#a)"/><line x1="765" y1="164" x2="765" y2="214" stroke="#6b7280" stroke-width="2.2" marker-end="url(#a)"/><line x1="200" y1="246" x2="330" y2="246" stroke="#6b7280" stroke-width="2.2" marker-end="url(#a)" marker-start="url(#b)"/><line x1="550" y1="246" x2="680" y2="246" stroke="#6b7280" stroke-width="2.2" marker-end="url(#a)" marker-start="url(#b)"/><text x="265" y="236" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#6b7280" font-style="italic">encrypted</text><text x="265" y="266" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#6b7280" font-style="italic">end to end</text><text x="615" y="236" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#6b7280" font-style="italic">encrypted</text><text x="615" y="266" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#6b7280" font-style="italic">end to end</text><line x1="440" y1="60" x2="440" y2="180" stroke="#d97706" stroke-width="2.2" marker-end="url(#a)" stroke-dasharray="6 5"/><text x="452" y="126" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#b45309" font-style="italic">opens only when both sides added</text><rect x="30" y="336" width="260" height="66" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/><text x="160.0" y="364.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1e1b4b">No default relay,</text><text x="160.0" y="381.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#4b5563">no directory, no accounts</text><rect x="310" y="336" width="260" height="66" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/><text x="440.0" y="364.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1e1b4b">Read-only by construction:</text><text x="440.0" y="381.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#4b5563">no message kind can run anything</text><rect x="590" y="336" width="260" height="66" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/><text x="720.0" y="364.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1e1b4b">You release a message,</text><text x="720.0" y="381.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#4b5563">you approve every reply</text></svg>
