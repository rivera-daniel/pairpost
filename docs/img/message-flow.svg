<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-labelledby="t d"><title id="t">How a message moves</title><desc id="d">An inbound message is decrypted, parsed by a locked-down reader into an inert record and shown as metadata. You release it to your agent, which can only draft a reply. You approve the exact text and one code path sends it.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker><marker id="b" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0L0 5L10 10z" fill="#6b7280"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><rect x="30" y="40" width="190" height="96" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/><text x="125.0" y="83.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1e1b4b">Sealed message arrives</text><text x="125.0" y="100.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#4b5563">from an active contact only</text><rect x="255" y="40" width="190" height="96" rx="10" fill="#eef0ff" stroke="#6366f1" stroke-width="2"/><text x="350.0" y="74.5" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1e1b4b">Decrypt and verify</text><text x="350.0" y="91.5" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#4b5563">the key holder reads a fixed</text><text x="350.0" y="108.5" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#4b5563">header, never the body</text><rect x="480" y="40" width="190" height="96" rx="10" fill="#eef0ff" stroke="#6366f1" stroke-width="2"/><text x="575.0" y="66.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1e1b4b">Locked-down reader</text><text x="575.0" y="83.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#4b5563">no network, no secrets,</text><text x="575.0" y="100.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#4b5563">read-only: body becomes a</text><text x="575.0" y="117.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#4b5563">typed record, or is dropped</text><rect x="705" y="40" width="190" height="96" rx="10" fill="#eef0ff" stroke="#6366f1" stroke-width="2"/><text x="800.0" y="74.5" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1e1b4b">Your inbox</text><text x="800.0" y="91.5" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#4b5563">metadata only: kind, size,</text><text x="800.0" y="108.5" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#4b5563">time, who. No content.</text><line x1="220" y1="88" x2="255" y2="88" stroke="#6b7280" stroke-width="2.2" marker-end="url(#a)"/><line x1="445" y1="88" x2="480" y2="88" stroke="#6b7280" stroke-width="2.2" marker-end="url(#a)"/><line x1="670" y1="88" x2="705" y2="88" stroke="#6b7280" stroke-width="2.2" marker-end="url(#a)"/><text x="450" y="24" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1e1b4b">Inbound</text><rect x="705" y="170" width="190" height="56" rx="10" fill="#fff3d6" stroke="#d97706" stroke-width="2"/><text x="800.0" y="193.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#1e1b4b">You release a message</text><text x="800.0" y="209.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#4b5563">you read it in your own app</text><line x1="800" y1="136" x2="800" y2="170" stroke="#d97706" stroke-width="2.2" marker-end="url(#a)"/><text x="450" y="294" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1e1b4b">Outbound</text><path d="M800 226 V300" fill="none" stroke="#6b7280" stroke-width="2.2" marker-end="url(#a)"/><rect x="705" y="314" width="190" height="96" rx="10" fill="#eef0ff" stroke="#6366f1" stroke-width="2"/><text x="800.0" y="348.5" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1e1b4b">Agent reads it as data</text><text x="800.0" y="365.5" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#4b5563">text marked untrusted;</text><text x="800.0" y="382.5" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#4b5563">the session is now tainted</text><rect x="480" y="314" width="190" height="96" rx="10" fill="#eef0ff" stroke="#6366f1" stroke-width="2"/><text x="575.0" y="348.5" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1e1b4b">Agent drafts a reply</text><text x="575.0" y="365.5" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#4b5563">it has no way to send,</text><text x="575.0" y="382.5" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#4b5563">only to prepare a draft</text><rect x="255" y="314" width="190" height="96" rx="10" fill="#fff3d6" stroke="#d97706" stroke-width="2"/><text x="350.0" y="348.5" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1e1b4b">You approve the exact text</text><text x="350.0" y="365.5" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#4b5563">recipient and fingerprint shown;</text><text x="350.0" y="382.5" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#4b5563">one single-use approval</text><rect x="30" y="314" width="190" height="96" rx="10" fill="#e6f6ec" stroke="#16a34a" stroke-width="2"/><text x="125.0" y="348.5" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1e1b4b">One code path sends</text><text x="125.0" y="365.5" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#4b5563">checks approval, e-stop,</text><text x="125.0" y="382.5" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#4b5563">limits, then logs, then sends</text><line x1="705" y1="362" x2="670" y2="362" stroke="#6b7280" stroke-width="2.2" marker-end="url(#a)"/><line x1="480" y1="362" x2="445" y2="362" stroke="#6b7280" stroke-width="2.2" marker-end="url(#a)"/><line x1="255" y1="362" x2="220" y2="362" stroke="#6b7280" stroke-width="2.2" marker-end="url(#a)"/><text x="450" y="448" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#4b5563" font-style="italic">Two human gates: nothing is read by your agent until you release it, and nothing leaves until you approve it.</text></svg>
