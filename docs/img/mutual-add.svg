<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" role="img" aria-labelledby="t d"><title id="t">The mutual add</title><desc id="d">One person adds the other, who cannot tell. The second person adds back later. Then the handshake runs and the contact is active. A stranger cannot compute the mailbox.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker><marker id="b" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0L0 5L10 10z" fill="#6b7280"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="200" y="26" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#1e1b4b">You</text><text x="680" y="26" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#1e1b4b">Your contact</text><rect x="40" y="44" width="320" height="60" rx="10" fill="#eef0ff" stroke="#6366f1" stroke-width="2"/><text x="200.0" y="69.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#1e1b4b">1. You add their address (pp1…)</text><text x="200.0" y="87.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#4b5563">check the fingerprint, give them a nickname</text><rect x="120" y="128" width="160" height="34" rx="10" fill="#fff3d6" stroke="#d97706" stroke-width="2"/><text x="200.0" y="149.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#1e1b4b">you are pending</text><text x="214" y="190" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#6b7280" font-style="italic">they cannot tell, nothing is sent</text><rect x="520" y="206" width="320" height="60" rx="10" fill="#eef0ff" stroke="#6366f1" stroke-width="2"/><text x="680.0" y="231.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#1e1b4b">2. They add your address</text><text x="680.0" y="249.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#4b5563">whenever they choose</text><path d="M360 74 H440 V236 H520" fill="none" stroke="#6b7280" stroke-width="2.2" marker-end="url(#a)"/><text x="450" y="150" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#6b7280" font-style="italic">no message, no request</text><rect x="40" y="300" width="800" height="56" rx="10" fill="#e6f6ec" stroke="#16a34a" stroke-width="2"/><text x="440.0" y="323.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#1e1b4b">3. Both apps run the handshake: the contact is active, messages can flow</text><text x="440.0" y="341.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#4b5563">each side already holds the other’s public key, so the handshake can only succeed between the two of you</text><line x1="200" y1="162" x2="200" y2="300" stroke="#d97706" stroke-width="2.2" marker-end="url(#a)" stroke-dasharray="6 5"/><text x="214" y="252" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#b45309" font-style="italic">pending lasts up to 30 days</text><line x1="680" y1="266" x2="680" y2="300" stroke="#16a34a" stroke-width="2.2" marker-end="url(#a)"/><rect x="180" y="376" width="520" height="54" rx="10" fill="#fde8e8" stroke="#dc2626" stroke-width="2"/><text x="440.0" y="398.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1e1b4b">A stranger: nothing to read</text><text x="440.0" y="415.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#4b5563">holds your public address, not your private key, so it cannot compute your mailbox</text></svg>
